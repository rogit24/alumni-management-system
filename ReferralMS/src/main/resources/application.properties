# ==========================================
# Application Configuration
# ==========================================
server.port=8085
spring.application.name=REFERRAL-SERVICE

# ==========================================
# MySQL Database
# ==========================================
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/referral_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:manager}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ==========================================
# JPA / Hibernate
# ==========================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# ==========================================
# Eureka Client
# ==========================================
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

# ==========================================
# Logging
# ==========================================
logging.level.org.springframework.web=INFO
logging.level.com.alumniconnect=DEBUG
