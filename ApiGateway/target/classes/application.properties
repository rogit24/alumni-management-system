server.port=9191
spring.application.name=api-gateway

# Eureka configuration
eureka.client.serviceUrl.defaultZone=http://localhost:8761/eureka/

# Gateway Global CORS Configuration
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowedOriginPatterns=*
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowedMethods=GET,POST,PUT,DELETE,OPTIONS
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowedHeaders=*

# ---------------------------------------------------------
# SWAGGER DOCS ROUTES (Evaluated BEFORE secured wildcard API routes)
# ---------------------------------------------------------
# Route 0: UserService Swagger docs
spring.cloud.gateway.routes[0].id=user-service-docs
spring.cloud.gateway.routes[0].uri=lb://USER-SERVICE
spring.cloud.gateway.routes[0].predicates[0]=Path=/api/v1/auth/v3/api-docs
spring.cloud.gateway.routes[0].filters[0]=RewritePath=/api/v1/auth/v3/api-docs,/v3/api-docs

# Route 1: TemplateMS Swagger docs
spring.cloud.gateway.routes[1].id=template-service-docs
spring.cloud.gateway.routes[1].uri=lb://TEMPLATE-SERVICE
spring.cloud.gateway.routes[1].predicates[0]=Path=/api/v1/template/v3/api-docs
spring.cloud.gateway.routes[1].filters[0]=RewritePath=/api/v1/template/v3/api-docs,/v3/api-docs

# Route 2: ProfileMS Swagger docs
spring.cloud.gateway.routes[2].id=profile-service-docs
spring.cloud.gateway.routes[2].uri=lb://PROFILE-SERVICE
spring.cloud.gateway.routes[2].predicates[0]=Path=/api/v1/profiles/v3/api-docs
spring.cloud.gateway.routes[2].filters[0]=RewritePath=/api/v1/profiles/v3/api-docs,/v3/api-docs

# Route 3: MessageMS Swagger docs
spring.cloud.gateway.routes[3].id=message-service-docs
spring.cloud.gateway.routes[3].uri=lb://MESSAGE-SERVICE
spring.cloud.gateway.routes[3].predicates[0]=Path=/api/v1/messages/v3/api-docs
spring.cloud.gateway.routes[3].filters[0]=RewritePath=/api/v1/messages/v3/api-docs,/v3/api-docs

# Route 12: JobMS Swagger docs mapping
spring.cloud.gateway.routes[12].id=job-service-docs
spring.cloud.gateway.routes[12].uri=lb://JOB-SERVICE
spring.cloud.gateway.routes[12].predicates[0]=Path=/api/v1/jobs/v3/api-docs
spring.cloud.gateway.routes[12].filters[0]=RewritePath=/api/v1/jobs/v3/api-docs,/v3/api-docs

# Route 13: ApplicationMS Swagger docs mapping
spring.cloud.gateway.routes[13].id=application-service-docs
spring.cloud.gateway.routes[13].uri=lb://APPLICATION-SERVICE
spring.cloud.gateway.routes[13].predicates[0]=Path=/api/v1/applications/v3/api-docs
spring.cloud.gateway.routes[13].filters[0]=RewritePath=/api/v1/applications/v3/api-docs,/v3/api-docs

# Route 14: ReferralMS Swagger docs mapping
spring.cloud.gateway.routes[14].id=referral-service-docs
spring.cloud.gateway.routes[14].uri=lb://REFERRAL-SERVICE
spring.cloud.gateway.routes[14].predicates[0]=Path=/api/v1/referrals/v3/api-docs
spring.cloud.gateway.routes[14].filters[0]=RewritePath=/api/v1/referrals/v3/api-docs,/v3/api-docs

# Route 15: NotificationMS Swagger docs mapping
spring.cloud.gateway.routes[15].id=notification-service-docs
spring.cloud.gateway.routes[15].uri=lb://NOTIFICATION-SERVICE
spring.cloud.gateway.routes[15].predicates[0]=Path=/api/v1/notifications/v3/api-docs
spring.cloud.gateway.routes[15].filters[0]=RewritePath=/api/v1/notifications/v3/api-docs,/v3/api-docs

# ---------------------------------------------------------
# BUSINESS API ROUTES
# ---------------------------------------------------------
# Route 4: Public Auth APIs (Bypass Filter)
spring.cloud.gateway.routes[4].id=user-service-public
spring.cloud.gateway.routes[4].uri=lb://USER-SERVICE
spring.cloud.gateway.routes[4].predicates[0]=Path=/api/v1/auth/register,/api/v1/auth/login

# Route 5: Secure User/Auth APIs
spring.cloud.gateway.routes[5].id=user-service-secured
spring.cloud.gateway.routes[5].uri=lb://USER-SERVICE
spring.cloud.gateway.routes[5].predicates[0]=Path=/api/v1/auth/users/**
spring.cloud.gateway.routes[5].filters[0]=AuthenticationFilter

# Route 6: Profile Service APIs
spring.cloud.gateway.routes[6].id=profile-service
spring.cloud.gateway.routes[6].uri=lb://PROFILE-SERVICE
spring.cloud.gateway.routes[6].predicates[0]=Path=/api/v1/profiles/**
spring.cloud.gateway.routes[6].filters[0]=AuthenticationFilter

# Route 7: Job Service APIs
spring.cloud.gateway.routes[7].id=job-service
spring.cloud.gateway.routes[7].uri=lb://JOB-SERVICE
spring.cloud.gateway.routes[7].predicates[0]=Path=/api/v1/jobs/**
spring.cloud.gateway.routes[7].filters[0]=AuthenticationFilter

# Route 8: Application Service APIs
spring.cloud.gateway.routes[8].id=application-service
spring.cloud.gateway.routes[8].uri=lb://APPLICATION-SERVICE
spring.cloud.gateway.routes[8].predicates[0]=Path=/api/v1/applications/**
spring.cloud.gateway.routes[8].filters[0]=AuthenticationFilter

# Route 9: Message Service APIs
spring.cloud.gateway.routes[9].id=message-service
spring.cloud.gateway.routes[9].uri=lb://MESSAGE-SERVICE
spring.cloud.gateway.routes[9].predicates[0]=Path=/api/v1/messages/**
spring.cloud.gateway.routes[9].filters[0]=AuthenticationFilter

# Route 10: Notification Service APIs
spring.cloud.gateway.routes[10].id=notification-service
spring.cloud.gateway.routes[10].uri=lb://NOTIFICATION-SERVICE
spring.cloud.gateway.routes[10].predicates[0]=Path=/api/v1/notifications/**
spring.cloud.gateway.routes[10].filters[0]=AuthenticationFilter

# Route 11: Referral Service APIs
spring.cloud.gateway.routes[11].id=referral-service
spring.cloud.gateway.routes[11].uri=lb://REFERRAL-SERVICE
spring.cloud.gateway.routes[11].predicates[0]=Path=/api/v1/referrals/**
spring.cloud.gateway.routes[11].filters[0]=AuthenticationFilter

# JWT Config (Must match UserService secret)
jwt.secret=my_super_secret_key_which_is_long_enough_for_sha256_key_and_more_characters_for_security

# Swagger UI Aggregator Configuration
springdoc.swagger-ui.urls[0].name=User Service
springdoc.swagger-ui.urls[0].url=/api/v1/auth/v3/api-docs
springdoc.swagger-ui.urls[1].name=Template Service
springdoc.swagger-ui.urls[1].url=/api/v1/template/v3/api-docs
springdoc.swagger-ui.urls[2].name=Profile Service
springdoc.swagger-ui.urls[2].url=/api/v1/profiles/v3/api-docs
springdoc.swagger-ui.urls[3].name=Message Service
springdoc.swagger-ui.urls[3].url=/api/v1/messages/v3/api-docs
springdoc.swagger-ui.urls[4].name=Job Service
springdoc.swagger-ui.urls[4].url=/api/v1/jobs/v3/api-docs
springdoc.swagger-ui.urls[5].name=Application Service
springdoc.swagger-ui.urls[5].url=/api/v1/applications/v3/api-docs
springdoc.swagger-ui.urls[6].name=Referral Service
springdoc.swagger-ui.urls[6].url=/api/v1/referrals/v3/api-docs
springdoc.swagger-ui.urls[7].name=Notification Service
springdoc.swagger-ui.urls[7].url=/api/v1/notifications/v3/api-docs

# Global CORS Configuration for Frontend Integration
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowedOriginPatterns=*
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowedMethods=*
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowedHeaders=*
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowCredentials=true
