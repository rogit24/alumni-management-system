server.port=9191
spring.application.name=api-gateway

# Eureka configuration
eureka.client.serviceUrl.defaultZone=http://localhost:8761/eureka/

# Spring Cloud Gateway Routing Configuration
# Route 0: Public Auth APIs (Bypass Filter)
spring.cloud.gateway.routes[0].id=user-service-public
spring.cloud.gateway.routes[0].uri=lb://USER-SERVICE
spring.cloud.gateway.routes[0].predicates[0]=Path=/api/v1/auth/register, /api/v1/auth/login

# Route 1: Secure User/Auth APIs
spring.cloud.gateway.routes[1].id=user-service-secured
spring.cloud.gateway.routes[1].uri=lb://USER-SERVICE
spring.cloud.gateway.routes[1].predicates[0]=Path=/api/v1/auth/users/**
spring.cloud.gateway.routes[1].filters[0]=AuthenticationFilter

# Route 2: Profile Service APIs
spring.cloud.gateway.routes[2].id=profile-service
spring.cloud.gateway.routes[2].uri=lb://PROFILE-SERVICE
spring.cloud.gateway.routes[2].predicates[0]=Path=/api/v1/profiles/**
spring.cloud.gateway.routes[2].filters[0]=AuthenticationFilter

# Route 3: Job Service APIs
spring.cloud.gateway.routes[3].id=job-service
spring.cloud.gateway.routes[3].uri=lb://JOB-SERVICE
spring.cloud.gateway.routes[3].predicates[0]=Path=/api/v1/jobs/**
spring.cloud.gateway.routes[3].filters[0]=AuthenticationFilter

# Route 4: Application Service APIs
spring.cloud.gateway.routes[4].id=application-service
spring.cloud.gateway.routes[4].uri=lb://APPLICATION-SERVICE
spring.cloud.gateway.routes[4].predicates[0]=Path=/api/v1/applications/**
spring.cloud.gateway.routes[4].filters[0]=AuthenticationFilter

# Route 5: Message Service APIs
spring.cloud.gateway.routes[5].id=message-service
spring.cloud.gateway.routes[5].uri=lb://MESSAGE-SERVICE
spring.cloud.gateway.routes[5].predicates[0]=Path=/api/v1/messages/**
spring.cloud.gateway.routes[5].filters[0]=AuthenticationFilter

# Route 6: Notification Service APIs
spring.cloud.gateway.routes[6].id=notification-service
spring.cloud.gateway.routes[6].uri=lb://NOTIFICATION-SERVICE
spring.cloud.gateway.routes[6].predicates[0]=Path=/api/v1/notifications/**
spring.cloud.gateway.routes[6].filters[0]=AuthenticationFilter

# Route 7: Referral Service APIs
spring.cloud.gateway.routes[7].id=referral-service
spring.cloud.gateway.routes[7].uri=lb://REFERRAL-SERVICE
spring.cloud.gateway.routes[7].predicates[0]=Path=/api/v1/referrals/**
spring.cloud.gateway.routes[7].filters[0]=AuthenticationFilter

# Route 8: UserService Swagger docs (maps gateway path to internal /v3/api-docs)
spring.cloud.gateway.routes[8].id=user-service-docs
spring.cloud.gateway.routes[8].uri=lb://USER-SERVICE
spring.cloud.gateway.routes[8].predicates[0]=Path=/api/v1/auth/v3/api-docs
spring.cloud.gateway.routes[8].filters[0]=RewritePath=/api/v1/auth/v3/api-docs, /v3/api-docs

# Route 9: TemplateMS Swagger docs
spring.cloud.gateway.routes[9].id=template-service-docs
spring.cloud.gateway.routes[9].uri=lb://TEMPLATE-SERVICE
spring.cloud.gateway.routes[9].predicates[0]=Path=/api/v1/template/v3/api-docs
spring.cloud.gateway.routes[9].filters[0]=RewritePath=/api/v1/template/v3/api-docs, /v3/api-docs

# Route 10: JobMS Swagger docs
spring.cloud.gateway.routes[10].id=job-service-docs
spring.cloud.gateway.routes[10].uri=lb://JOB-SERVICE
spring.cloud.gateway.routes[10].predicates[0]=Path=/api/v1/jobs/v3/api-docs
spring.cloud.gateway.routes[10].filters[0]=RewritePath=/api/v1/jobs/v3/api-docs, /v3/api-docs

# JWT Config (Must match UserService secret)
jwt.secret=my_super_secret_key_which_is_long_enough_for_sha256_key_and_more_characters_for_security

# Swagger UI Aggregator Configuration
springdoc.swagger-ui.urls[0].name=User Service
springdoc.swagger-ui.urls[0].url=/api/v1/auth/v3/api-docs
springdoc.swagger-ui.urls[1].name=Template Service
springdoc.swagger-ui.urls[1].url=/api/v1/template/v3/api-docs
springdoc.swagger-ui.urls[2].name=Job Service
springdoc.swagger-ui.urls[2].url=/api/v1/jobs/v3/api-docs



